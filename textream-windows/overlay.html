<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Textream 提词器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
      background: transparent;
      color: #f5f5f7;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    /* ── 主容器 ── */
    .overlay {
      width: 100vw;
      height: 100vh;
      background: rgba(10, 10, 11, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      padding: 16px 20px;
      position: relative;
    }

    /* ── 台词滚动区 ── */
    .script-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .script-text {
      font-size: 24px;
      line-height: 1.5;
      text-align: center;
      color: #f5f5f7;
      max-height: 100%;
      overflow-y: auto;
      padding: 8px 0;
      scrollbar-width: none;
      -webkit-app-region: no-drag;
    }
    .script-text::-webkit-scrollbar { display: none; }

    /* ── AI 建议栏 ── */
    .suggestion-bar {
      margin-top: 8px;
      padding: 10px 14px;
      background: rgba(192, 132, 252, 0.12);
      border: 1px solid rgba(192, 132, 252, 0.25);
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    .suggestion-icon {
      font-size: 14px;
      color: #c084fc;
      flex-shrink: 0;
    }

    .suggestion-text {
      font-size: 13px;
      color: #c084fc;
      line-height: 1.4;
      flex: 1;
    }

    /* ── 状态指示器 ── */
    .status-bar {
      position: absolute;
      top: 8px;
      right: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      -webkit-app-region: no-drag;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px rgba(74, 222, 128, 0.4);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-text {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
    }

    /* ── 控制栏 ── */
    .controls {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      -webkit-app-region: no-drag;
    }

    .ctrl-btn {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.6);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .ctrl-btn:hover {
      background: rgba(255,255,255,0.1);
      color: #f5f5f7;
    }

    .ctrl-btn.primary {
      background: rgba(192, 132, 252, 0.15);
      border-color: rgba(192, 132, 252, 0.3);
      color: #c084fc;
    }

    .ctrl-btn.primary:hover {
      background: rgba(192, 132, 252, 0.25);
    }

    /* ── 点击穿透模式提示 ── */
    .click-through-hint {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      color: rgba(255,255,255,0.2);
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(0,0,0,0.3);
      display: none;
    }
    .click-through-hint.visible { display: block; }
  </style>
</head>
<body>
  <div class="overlay">
    <!-- 状态指示器 -->
    <div class="status-bar">
      <span class="status-dot"></span>
      <span class="status-text">直播中</span>
    </div>

    <!-- 台词滚动区 -->
    <div class="script-area">
      <div class="script-text" id="scriptText">
        欢迎来到直播间！<br>今天给大家带来一款超级好用的产品...
      </div>
    </div>

    <!-- AI 建议栏 -->
    <div class="suggestion-bar">
      <span class="suggestion-icon">💡</span>
      <span class="suggestion-text" id="suggestionText">
        点击「开始捕获」启用 AI 话术建议
      </span>
    </div>

    <!-- 控制栏 -->
    <div class="controls">
      <button class="ctrl-btn primary" id="startBtn" onclick="toggleCapture()">
        ▶ 开始捕获
      </button>
      <button class="ctrl-btn" onclick="window.close()">
        ✕ 关闭
      </button>
    </div>

    <!-- 点击穿透提示 -->
    <div class="click-through-hint" id="clickThroughHint">
      Alt+O 切换点击穿透
    </div>
  </div>

  <script>
    let isCapturing = false;

    // 监听点击穿透模式
    if (window.textream) {
      window.textream.onClickThroughMode((enabled) => {
        document.getElementById('clickThroughHint').classList.toggle('visible', enabled);
      });
    }

    function toggleCapture() {
      isCapturing = !isCapturing;
      const btn = document.getElementById('startBtn');
      if (isCapturing) {
        btn.textContent = '⏹ 停止捕获';
        btn.classList.remove('primary');
        btn.style.background = 'rgba(248,113,113,0.15)';
        btn.style.borderColor = 'rgba(248,113,113,0.3)';
        btn.style.color = '#f87171';
        document.getElementById('suggestionText').textContent = '弹幕捕获中... AI 自动生成话术';
      } else {
        btn.textContent = '▶ 开始捕获';
        btn.classList.add('primary');
        btn.style.background = '';
        btn.style.borderColor = '';
        btn.style.color = '';
        document.getElementById('suggestionText').textContent = '点击「开始捕获」启用 AI 话术建议';
      }
    }
  </script>
</body>
</html>
